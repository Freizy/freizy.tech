    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does Freizy Technologies do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We design, build and support business software, applied AI systems, and the IT infrastructure they run on — servers, networks and cybersecurity. We are based in Accra, Ghana and work with teams worldwide."
            }
          },
          {
            "@type": "Question",
            "name": "How fast will you respond to my enquiry?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We reply within one business day. Leave your details through the contact form or the consultation button and a real person — usually an engineer — will get back to you."
            }
          },
          {
            "@type": "Question",
            "name": "Can I try your products before committing?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every product page includes a sample preview running on representative data, and Stays, Lavida Health Buddy and KSM Autos have public sites you can open. For the rest, request a demo and we will walk through your own workflow on a call."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide support after delivery?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — support is our differentiator. The six products on this page are maintained by us, so help comes from the people who wrote the code, not a third-party helpdesk."
            }
          },
          {
            "@type": "Question",
            "name": "Where are you located?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Freizy Technologies is based in Accra, Ghana. We serve clients across Ghana and remotely worldwide. Reach sales on +233 24 035 2196 and support on +233 26 624 2703."
            }
          },
          {
            "@type": "Question",
            "name": "How do we start a project with you?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Start a conversation: use the contact form, tap “Talk to engineers”, or message us on WhatsApp. We will scope the work with you, then design, build, deploy and support it as one accountable team."
            }
          }
        ]
      }
