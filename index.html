<!doctype html>
<html lang="en" class="dark scroll-smooth" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freizy Technologies — Software, AI and Infrastructure</title>
    <meta
      name="description"
      content="Freizy Technologies in Accra, Ghana designs and builds business software, applied AI, and IT infrastructure. Six products, eight services, one accountable team."
    />
    <meta
      property="og:title"
      content="Freizy Technologies — Software, AI and Infrastructure"
    />
    <meta
      property="og:description"
      content="Business software, applied AI, and dependable IT infrastructure — designed, built and supported by one team."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://freizy.com/" />
    <meta property="og:image" content="https://freizy.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Freizy Technologies — Software, AI and Infrastructure" />
    <meta
      name="twitter:description"
      content="Business software, applied AI, and dependable IT infrastructure — designed, built and supported by one team."
    />
    <meta name="twitter:image" content="https://freizy.com/og-image.png" />
    <link rel="canonical" href="https://freizy.com/" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta property="og:site_name" content="Freizy Technologies" />
    <meta property="og:locale" content="en_GH" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Freizy Technologies",
        "url": "https://freizy.com/",
        "logo": "https://freizy.com/og-image.png",
        "description": "Business software, applied AI, robotics, and IT infrastructure designed, built and supported by one team in Accra, Ghana.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Accra",
          "addressCountry": "GH"
        },
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "telephone": "+233240352196",
            "contactType": "sales",
            "areaServed": "GH"
          },
          {
            "@type": "ContactPoint",
            "telephone": "+233266242703",
            "contactType": "customer support",
            "areaServed": "GH"
          }
        ]
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("freizy_theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const root = document.documentElement;
          if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
            root.classList.remove("light");
            root.classList.add("dark");
            root.setAttribute("data-theme", "dark");
          } else {
            root.classList.remove("dark");
            root.classList.add("light");
            root.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-white text-slate-900 dark:bg-[#08090d] dark:text-[#f1f3f5] antialiased selection:bg-[#E5252A] selection:text-white overflow-x-hidden transition-colors duration-200"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
